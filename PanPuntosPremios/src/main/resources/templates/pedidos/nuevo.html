<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Nuevo pedido')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('pedidos')}"></nav>
<main class="container pb-5" style="max-width: 900px">
    <h1 class="h3 mb-4">Nuevo pedido</h1>
    <div th:replace="~{fragments/layout :: alertas}"></div>

    <form class="card card-body" th:action="@{/pedidos}" method="post">
        <label class="form-label" for="idCliente">Cliente</label>
        <select class="form-select mb-4" name="idCliente" id="idCliente">
            <option value="">Consumidor final (no acumula puntos)</option>
            <option th:each="c : ${clientes}" th:value="${c.id}"
                    th:selected="${clienteSeleccionado != null && clienteSeleccionado == c.id}"
                    th:text="${c.nombreCompleto + ' · ' + c.identificador + ' (' + c.puntos + ' pts)'}"></option>
        </select>

        <div class="table-responsive">
            <table class="table align-middle">
                <thead><tr><th>Producto</th><th class="text-end">Precio</th><th>Puntos</th><th>Disponibles</th><th style="width: 110px">Cantidad</th></tr></thead>
                <tbody>
                <tr th:each="p : ${productos}" th:classappend="${!p.vendible} ? 'opacity-50'">
                    <td>
                        <span th:text="${p.nombre}">Producto</span>
                        <small class="text-secondary d-block" th:text="${p.menu} ? ${p.descripcionComponentes} : ${p.categoria.etiqueta}"></small>
                    </td>
                    <td class="text-end" th:text="${'Q ' + #numbers.formatDecimal(p.precio, 1, 'COMMA', 2, 'POINT')}">Q 0.00</td>
                    <td><span th:if="${p.puntosPorUnidad > 0}" class="badge puntos" th:text="${'+' + p.puntosPorUnidad}"></span></td>
                    <td th:text="${p.vendible} ? ${p.disponibles} : 'Agotado'">0</td>
                    <td>
                        <input type="hidden" name="productoId" th:value="${p.id}" th:disabled="${!p.vendible}">
                        <input type="number" name="cantidad" class="form-control form-control-sm" value="0" min="0"
                               th:max="${p.disponibles}" th:disabled="${!p.vendible}">
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <p class="small text-secondary">El pedido se crea como PENDIENTE. El inventario se descuenta y los puntos se suman al cobrar.</p>
        <button type="submit" class="btn btn-primary btn-lg"><i class="bi bi-check2-circle"></i> Crear pedido</button>
    </form>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
