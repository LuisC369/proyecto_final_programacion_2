<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Inicio')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('inicio')}"></nav>
<main class="container pb-5">
    <h1 class="h3 mb-4">Inicio</h1>
    <div th:replace="~{fragments/layout :: alertas}"></div>

    <div class="row g-3">
        <div class="col-md-4">
            <a class="card card-body text-decoration-none" th:href="@{/clientes}">
                <span class="text-secondary"><i class="bi bi-people"></i> Clientes activos</span>
                <span class="cifra" th:text="${clientesActivos}">0</span>
            </a>
        </div>
        <div class="col-md-8">
            <div class="card">
                <div class="card-header fw-semibold"><i class="bi bi-star"></i> Clientes con más puntos</div>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item d-flex justify-content-between align-items-center" th:each="c : ${topClientes}">
                        <span th:text="${c.nombreCompleto}">Cliente</span>
                        <span class="badge puntos" th:text="${c.puntos + ' pts'}">0 pts</span>
                    </li>
                    <li class="list-group-item text-secondary" th:if="${#lists.isEmpty(topClientes)}">Aún no hay clientes.</li>
                </ul>
            </div>
        </div>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
