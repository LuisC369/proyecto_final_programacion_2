<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Clientes')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('clientes')}"></nav>
<main class="container pb-5">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
        <h1 class="h3 mb-0">Clientes</h1>
        <a th:href="@{/clientes/nuevo}" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Nuevo cliente</a>
    </div>
    <div th:replace="~{fragments/layout :: alertas}"></div>

    <div class="card">
        <div class="card-body">
            <form class="d-flex gap-2 mb-3" th:action="@{/clientes}" method="get">
                <input type="search" name="q" class="form-control" th:value="${q}" placeholder="Buscar por nombre o identificador">
                <button type="submit" class="btn btn-outline-secondary" aria-label="Buscar"><i class="bi bi-search"></i></button>
            </form>
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead><tr><th>Cliente</th><th>Identificador</th><th>Teléfono</th><th>Puntos</th><th>Estado</th><th></th></tr></thead>
                    <tbody>
                    <tr th:each="c : ${clientes}">
                        <td><a th:href="@{/clientes/{id}(id=${c.id})}" th:text="${c.nombreCompleto}">Nombre</a></td>
                        <td th:text="${c.identificador}">123</td>
                        <td th:text="${c.telefono}"></td>
                        <td><span class="badge puntos" th:text="${c.puntos + ' pts'}">0 pts</span></td>
                        <td><span class="badge" th:classappend="${c.activo} ? 'text-bg-success' : 'text-bg-secondary'"
                                  th:text="${c.activo} ? 'Activo' : 'Inactivo'">Activo</span></td>
                        <td class="text-end text-nowrap">
                            <a th:href="@{/clientes/{id}/editar(id=${c.id})}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-pencil"></i> Editar</a>
                            <a th:if="${c.activo}" th:href="@{/pedidos/nuevo(cliente=${c.id})}" class="btn btn-sm btn-primary"><i class="bi bi-cart-plus"></i> Pedido</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(clientes)}"><td colspan="6" class="text-secondary">No se encontraron clientes.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
