<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' · Pan, Puntos y Premios'">Pan, Puntos y Premios</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<th:block th:fragment="navbar(activo)">
    <header class="navbar navbar-dark d-lg-none px-3 mb-3">
        <a class="navbar-brand fw-semibold" th:href="@{/}"><i class="bi bi-basket2-fill"></i> Pan, Puntos y Premios</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>
    </header>

    <div class="sidebar">
        <aside class="offcanvas-lg offcanvas-start" id="menu" tabindex="-1">
            <div class="offcanvas-header">
                <button type="button" class="btn-close btn-close-white ms-auto" data-bs-dismiss="offcanvas" data-bs-target="#menu"></button>
            </div>
            <div class="offcanvas-body flex-column p-3">
                <a class="d-flex align-items-center gap-2 text-white text-decoration-none fs-5 fw-semibold mb-4" th:href="@{/}">
                    <i class="bi bi-basket2-fill fs-3"></i> Pan, Puntos y Premios
                </a>
                <nav class="nav flex-column gap-1">
                    <a class="nav-link" th:classappend="${activo == 'inicio'} ? 'active'" th:href="@{/}"><i class="bi bi-house"></i> Inicio</a>
                    <a class="nav-link" th:classappend="${activo == 'clientes'} ? 'active'" th:href="@{/clientes}"><i class="bi bi-people"></i> Clientes</a>
                    <a class="nav-link" th:classappend="${activo == 'reportes'} ? 'active'" th:href="@{/reportes}"><i class="bi bi-file-earmark-pdf"></i> Reportes</a>
                </nav>
                <small class="text-white-50 mt-auto pt-4">Programación II · UMG</small>
            </div>
        </aside>
    </div>
</th:block>

<div th:fragment="alertas">
    <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show">
        <span th:text="${mensaje}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
</div>

<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</th:block>

</body>
</html>
