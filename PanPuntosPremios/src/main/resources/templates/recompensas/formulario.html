<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${recompensa.id == 0 ? 'Nueva recompensa' : 'Editar recompensa'})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('recompensas')}"></nav>
<main class="container pb-5" style="max-width: 720px">
    <h1 class="h3 mb-4" th:text="${recompensa.id == 0} ? 'Nueva recompensa' : 'Editar recompensa'">Recompensa</h1>
    <div th:replace="~{fragments/layout :: alertas}"></div>

    <form class="card card-body" th:action="@{/recompensas/guardar}" th:object="${recompensa}" method="post">
        <input type="hidden" th:field="*{id}">
        <div class="row g-3">
            <div class="col-12">
                <label class="form-label" for="nombre">Nombre *</label>
                <input class="form-control" th:field="*{nombre}" maxlength="60" required placeholder="Ej. Bebida gratuita">
            </div>
            <div class="col-md-5">
                <label class="form-label" for="puntosRequeridos">Puntos requeridos *</label>
                <input type="number" class="form-control" th:field="*{puntosRequeridos}" min="1" step="1" required>
            </div>
            <div class="col-md-7">
                <label class="form-label" for="idProducto">Producto que se entrega *</label>
                <select class="form-select" th:field="*{idProducto}" required>
                    <option value="0">Seleccione…</option>
                    <option th:each="p : ${productos}" th:value="${p.id}" th:text="${p.categoria.etiqueta + ' · ' + p.nombre}"></option>
                </select>
            </div>
        </div>
        <div class="d-flex gap-2 justify-content-end mt-4">
            <a th:href="@{/recompensas}" class="btn btn-outline-secondary">Cancelar</a>
            <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Guardar</button>
        </div>
    </form>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
